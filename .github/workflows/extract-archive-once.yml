name: Extract uploaded archive once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/extract-archive-once.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract archive and remove temporary workflow
        run: |
          set -eu
          test -f private-v9.zip
          test ! -e private
          unzip -q private-v9.zip -d .
          rm private-v9.zip
          rm .github/workflows/extract-archive-once.yml
      - name: Save the extracted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract project archive and remove ZIP'
          git push origin HEAD:main
