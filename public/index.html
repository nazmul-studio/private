<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | private</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500/30 selection:text-cyan-200"><div class="ambient-glow"></div><div class="ambient-glow-2"></div><main class="relative z-10 flex-1 grid place-items-center p-5"><div class="glass-card glow-cyan rounded-3xl grid md:grid-cols-[1fr_1.25fr] w-full max-w-3xl overflow-hidden">
<section class="grid place-content-center justify-items-center gap-3.5 p-8 text-center bg-gradient-to-br from-[#0b1a3d] via-[#06223a] to-[#041227] border-b md:border-b-0 md:border-r border-cyan-400/10" aria-hidden="true"><svg class="w-24 h-24 drop-shadow-[0_0_18px_rgba(6,182,212,0.6)]" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="url(#lg)"/><rect x="5" y="5" width="54" height="54" rx="13" fill="#030712"/><rect x="19" y="29" width="26" height="18" rx="3" fill="none" stroke="#22d3ee" stroke-width="3.5"/><path d="M24 29v-6a8 8 0 0 1 16 0v6" fill="none" stroke="#22d3ee" stroke-width="3.5"/><circle cx="32" cy="38" r="2.5" fill="#67e8f9"/></svg><strong class="text-xs font-mono font-bold tracking-wider uppercase text-white">Private by default</strong><span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-cyan-950/80 border border-cyan-500/30 text-[9px] font-mono text-cyan-300"><i class="w-1.5 h-1.5 rounded-full bg-cyan-400"></i>SECURED</span><span class="text-[10px] font-mono text-slate-400">Only the owner can open this vault.</span></section>
<section class="p-6 sm:p-8"><div class="flex items-center gap-2.5 mb-5 font-mono font-bold tracking-wide text-white"><span class="w-9 h-9 rounded-xl p-0.5 bg-gradient-to-tr from-blue-600 via-cyan-500 to-sky-400 glow-cyan flex items-center justify-center"><span class="w-full h-full rounded-[10px] bg-[#030712] flex items-center justify-center"><svg class="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span></span>private</div>
<h1 class="text-xl font-bold text-white mb-1">Sign in</h1><p class="text-xs text-slate-400 mb-4">Complete every step to open your vault.</p>

<div id="err" class="mb-4 px-3 py-2.5 rounded-xl text-xs font-mono text-rose-200 bg-rose-950/50 border border-rose-500/40" role="alert" hidden></div>
<form id="f" novalidate><p><button class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-200 bg-slate-900/60 border border-blue-950 hover:border-cyan-500/40 transition-all cursor-pointer" type="button" id="pk" hidden>Verify passkey</button></p><div class="flex flex-col gap-1.5 mb-4"><label for="pw" class="text-[10px] font-mono uppercase tracking-wider text-slate-400">Password</label><div class="flex items-center bg-[#040816] border border-blue-950 rounded-lg focus-within:border-cyan-400 transition-colors"><input id="pw" class="flex-1 min-w-0 bg-transparent text-xs text-slate-200 px-3 py-2.5 font-mono focus:outline-none" type="password" autocomplete="current-password" required><button type="button" id="tg" class="px-3 text-[10px] font-mono text-cyan-400 hover:text-cyan-300" aria-pressed="false">Show</button></div></div>
<div class="flex flex-col gap-1.5 mb-4"><label for="sc" class="text-[10px] font-mono uppercase tracking-wider text-slate-400">Secret code</label><div class="flex items-center bg-[#040816] border border-blue-950 rounded-lg focus-within:border-cyan-400 transition-colors"><input id="sc" class="flex-1 min-w-0 bg-transparent text-xs text-slate-200 px-3 py-2.5 font-mono focus:outline-none" type="password" autocomplete="off" required></div></div>
<div id="ts" class="flex flex-col gap-1.5 mb-4"></div>
<div class="flex gap-2"><button class="px-4 py-2.5 rounded-xl text-xs font-semibold text-black bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-400 hover:from-cyan-300 hover:to-blue-300 shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all cursor-pointer" type="submit">Continue</button></div></form>
<form id="o" hidden novalidate><p class="text-xs text-slate-400 mb-4">We emailed a 6-digit code to your login address.</p><div class="flex flex-col gap-1.5 mb-4"><label for="code" class="text-[10px] font-mono uppercase tracking-wider text-slate-400">Email code</label><div class="flex items-center bg-[#040816] border border-blue-950 rounded-lg focus-within:border-cyan-400 transition-colors"><input id="code" class="flex-1 min-w-0 bg-transparent text-xs text-slate-200 px-3 py-2.5 font-mono focus:outline-none" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div></div><button class="px-4 py-2.5 rounded-xl text-xs font-semibold text-black bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-400 hover:from-cyan-300 hover:to-blue-300 shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all cursor-pointer" type="submit">Open vault</button></form>
<p class="text-[11px] font-mono text-slate-400 mt-4"><a class="text-cyan-400 hover:text-cyan-300 underline" href="/recovery.html">Locked out? Start recovery</a></p></section></div></main><script src="/assets/login.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=tsReady" defer></script></body></html>
