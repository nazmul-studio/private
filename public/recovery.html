<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recovery | private</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyan-500/30 selection:text-cyan-200"><div class="ambient-glow"></div><div class="ambient-glow-2"></div><main class="relative z-10 flex-1 grid place-items-center p-5"><div class="glass-card glow-cyan rounded-3xl p-6 sm:p-8 w-full max-w-md"><div class="flex items-center gap-2.5 mb-5 font-mono font-bold tracking-wide text-white"><span class="w-9 h-9 rounded-xl p-0.5 bg-gradient-to-tr from-blue-600 via-cyan-500 to-sky-400 glow-cyan flex items-center justify-center"><span class="w-full h-full rounded-[10px] bg-[#030712] flex items-center justify-center"><svg class="w-4 h-4 text-cyan-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span></span>private</div><h1 class="text-xl font-bold text-white mb-1">Recovery</h1>
<p class="text-xs text-slate-400 mb-4">Your files are never changed by failed sign-ins. Recovery needs your security email and your secret code.</p>
<div id="err" class="mb-4 px-3 py-2.5 rounded-xl text-xs font-mono text-rose-200 bg-rose-950/50 border border-rose-500/40" role="alert" hidden></div><p id="ok" class="muted" role="status"></p>
<form id="a" novalidate><div id="ts" class="flex flex-col gap-1.5 mb-4"></div><button class="px-4 py-2.5 rounded-xl text-xs font-semibold text-black bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-400 hover:from-cyan-300 hover:to-blue-300 shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all cursor-pointer" type="submit">Email me a recovery link</button></form>
<form id="b" hidden novalidate><div class="flex flex-col gap-1.5 mb-4"><label for="sc" class="text-[10px] font-mono uppercase tracking-wider text-slate-400">Secret code</label><div class="flex items-center bg-[#040816] border border-blue-950 rounded-lg focus-within:border-cyan-400 transition-colors"><input id="sc" class="flex-1 min-w-0 bg-transparent text-xs text-slate-200 px-3 py-2.5 font-mono focus:outline-none" type="password" autocomplete="off"></div></div><button class="px-4 py-2.5 rounded-xl text-xs font-semibold text-black bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-400 hover:from-cyan-300 hover:to-blue-300 shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all cursor-pointer" type="submit">Continue</button></form>
<form id="c" hidden novalidate><div class="flex flex-col gap-1.5 mb-4"><label for="np" class="text-[10px] font-mono uppercase tracking-wider text-slate-400">New password (12+ characters)</label><div class="flex items-center bg-[#040816] border border-blue-950 rounded-lg focus-within:border-cyan-400 transition-colors"><input id="np" class="flex-1 min-w-0 bg-transparent text-xs text-slate-200 px-3 py-2.5 font-mono focus:outline-none" type="password" autocomplete="new-password"></div></div><div class="flex flex-col gap-1.5 mb-4"><label for="ns" class="text-[10px] font-mono uppercase tracking-wider text-slate-400">New secret code (8+ characters)</label><div class="flex items-center bg-[#040816] border border-blue-950 rounded-lg focus-within:border-cyan-400 transition-colors"><input id="ns" class="flex-1 min-w-0 bg-transparent text-xs text-slate-200 px-3 py-2.5 font-mono focus:outline-none" type="password" autocomplete="off"></div></div><div class="flex flex-col gap-1.5 mb-4"><label for="ne" class="text-[10px] font-mono uppercase tracking-wider text-slate-400">New login email (optional)</label><div class="flex items-center bg-[#040816] border border-blue-950 rounded-lg focus-within:border-cyan-400 transition-colors"><input id="ne" class="flex-1 min-w-0 bg-transparent text-xs text-slate-200 px-3 py-2.5 font-mono focus:outline-none" type="email" autocomplete="email"></div></div><div class="flex flex-col gap-1.5 mb-4"><label class="flex items-center gap-2 text-[11px] font-mono text-slate-300"><input class="accent-cyan-400"  id="rp" type="checkbox"> Remove all passkeys</label></div><div class="flex flex-col gap-1.5 mb-4"><label class="flex items-center gap-2 text-[11px] font-mono text-slate-300"><input class="accent-cyan-400"  id="cf" type="checkbox"> Reset my password and secret code, and sign out all sessions</label></div><button class="px-4 py-2.5 rounded-xl text-xs font-semibold text-black bg-gradient-to-r from-cyan-400 via-sky-300 to-blue-400 hover:from-cyan-300 hover:to-blue-300 shadow-[0_0_15px_rgba(6,182,212,0.4)] transition-all cursor-pointer" type="submit">Reset credentials</button></form>
<p class="text-[11px] font-mono mt-4"><a class="text-cyan-400 hover:text-cyan-300 underline" href="/">Back to sign in</a></p></div></main><script src="/assets/recovery.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=tsReady" defer></script></body></html>
