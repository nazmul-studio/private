<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recovery | private</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head>
<body><main class="login"><div class="card narrow"><div class="brand"><img src="/assets/logo.svg" alt="">private</div><h1>Recovery</h1>
<p class="muted">Your files are never changed by failed sign-ins. Recovery needs your security email and your secret code.</p>
<div id="err" class="alert" role="alert" hidden></div><p id="ok" class="muted" role="status"></p>
<form id="a" novalidate><div id="ts" class="field"></div><button class="btn primary" type="submit">Email me a recovery link</button></form>
<form id="b" hidden novalidate><div class="field"><label for="sc">Secret code</label><div class="input"><input id="sc" type="password" autocomplete="off"></div></div><button class="btn primary" type="submit">Continue</button></form>
<form id="c" hidden novalidate><div class="field"><label for="np">New password (12+ characters)</label><div class="input"><input id="np" type="password" autocomplete="new-password"></div></div><div class="field"><label for="ns">New secret code (8+ characters)</label><div class="input"><input id="ns" type="password" autocomplete="off"></div></div><div class="field"><label for="ne">New login email (optional)</label><div class="input"><input id="ne" type="email" autocomplete="email"></div></div><div class="field"><label><input id="rp" type="checkbox"> Remove all passkeys</label></div><div class="field"><label><input id="cf" type="checkbox"> Reset my password and secret code, and sign out all sessions</label></div><button class="btn primary" type="submit">Reset credentials</button></form>
<p><a href="/">Back to sign in</a></p></div></main><script src="/assets/recovery.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=tsReady" defer></script></body></html>
