<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overview | private</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/assets/style.css"></head>
<body><div class="app"><aside class="side" id="side"><div class="brand"><img src="/assets/logo.svg" alt="">private</div><nav class="nav" id="nav" aria-label="Main"></nav><button class="btn" id="out">Sign out</button></aside>
<main class="main"><div class="top"><button class="btn menu" id="menu" aria-expanded="false" aria-controls="side">Menu</button><div class="input"><input type="search" id="q" aria-label="Filter files by name" placeholder="Filter files by name"></div><button class="btn primary" id="up">Upload</button><input type="file" id="file" multiple hidden accept="image/*,video/*,application/pdf,.heic,.mov"></div>
<p id="stat" class="muted" role="status"></p><progress id="prog" max="100" value="0" hidden aria-label="Upload progress"></progress> <button class="btn" id="cancel" hidden>Cancel upload</button><div id="view"></div></main></div><input type="file" id="rfile" hidden accept="video/mp4,video/quicktime,.mp4,.mov">
<dialog id="pick" aria-labelledby="pt"><form id="pform"><h2 id="pt">Add to…</h2><div class="field"><label for="psel">Album or folder</label><select id="psel"></select></div><div class="row"><button class="btn primary" type="submit">Add</button><button class="btn" type="button" id="pcancel">Cancel</button></div></form></dialog>
<script type="module" src="/assets/app.js"></script></body></html>
